<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <section>
            <h1 class="top-header">Tricycle Scheduler</h1>
            <div class="login-container">
                <form method="POST" id="form">
                    <fieldset>
                        <legend>Log In</legend>
                        <label for="username">Username:<input type="text" id="username" placeholder="e.g John Doe" class="input-field" required></label>
                        <label for="password">Password:<input type="password" id="password" placeholder="Password" class="input-field" required></label>
                        <button class="login-btn">Log In</button>
                    </fieldset>
                </form>
                <a href="Registration/registration.html">Don't have an account? Register here.</a>
            </div>
        </section>
    </main>
</body>
</html>
