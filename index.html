<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNTNS Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <section>
            <div class="login-form">
                <div class="login-input left">
                    <img src="Assets/Sakayna.jpeg" alt="Logo" class="login-logo-img">
                    <h1>Admin Login</h1>
                    <h2>Welcome Back!</h2>
                    <form action="" class="form-container">
                        <label for="username" class="login-label">Username</label>
                        <input type="text" id="username" name="username" required>
                        <label for="password" class="login-label">Password</label>
                        <input type="password" id="password" name="password" required>
                        <a href="#" id="forgot-password">Forgot Password?</a>
                        <input type="submit" id="submit-btn" value="Log In">
                    </form>
                </div>
                <div class="login-logo right">
                    <h1>(SNTNS) Sakay na Turno na System</h1>
                    <h3>Developed by: Acelo and Tanawan</h3>
                </div>
            </div>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
