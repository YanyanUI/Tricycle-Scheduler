<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <link rel="stylesheet" href="schedule.css">
</head>
<body>
    <main>
        <section class="sidebar">
            <div class="sidebar-header">
                <img src="../Assets/Sakayna.jpeg" alt="logo" class="SNTNS-logo">
                <div class="sidebar-header-text">
                    <h1>SNTNS</h1>
                    <h3>Sakay na Turno na System</h3>
                </div>
            </div>
            <div class="section-header">
                <div>
                    <img src="../Assets/Clock.png" alt="dashboard icon" class="header-icons">
                    <span id="section-header-text">Terminal Schedule</span>
                </div>

                <div class="menu-container">
                    <button class="menu"><img src="../Assets/menu_Icon.png" alt="menu icon" class="header-icons"></button>
                    <div class="mobile-only">
                        <ul>
                            <li><img src="/Assets/dashboard_Icon.png" alt="dashboard Icon" class="list-style"><a href="../Dashboard/dashboard.html">Dashboard</a></li>
                            <li><img src="/Assets/license_logo.png" alt="driver logo" class="list-style"><a href="../Drivers/driver.html">Driver</a></li>
                            <li><img src="/Assets/add_driver.png" alt="add driver icon" class="list-style"><a href="#">Register</a></li>
                            <li><img src="/Assets/Calendar_Nav.png" alt="calendar icon" class="list-style"><a href="">Schedule</a></li>
                            <li><img src="/Assets/Log Out.png" alt="logout icon" class="list-style"><a href="">Log Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <nav class="laptop-only">
                <ul>
                    <li><img src="../Assets/dashboard_Icon.png" alt="dashboard icon" class="header-icons"><a href="../Dashboard/dashboard.html" class="nav-link">Dashboard</a></li>
                    <li><img src="../Assets/license_logo.png" alt="drivers icon" class="header-icons"><a href="../Drivers/driver.html" class="nav-link">Drivers</a></li>
                    <li><img src="../Assets/add_driver.png" alt="register icon" class="header-icons"><a href="#" class="nav-link">Register Driver</a></li>
                    <li><img src="../Assets/Calendar_Nav.png" alt="schedule icon" class="header-icons"><a href="#" class="nav-link">Schedule</a></li>
                    <li><img src="../Assets/Log Out.png" alt="logout icon" class="header-icons"><a href="#" class="nav-link">Logout</a></li>
                </ul>
            </nav>
        </section>

        <section class="table-section">
            <div class="upper-table-tab">
                <div class="search-input">
                    <img src="../Assets/search_icon.png" class="icons">
                    <input type="search" placeholder="Search driver or plates...">
                </div>
                <button class="assign-btn">+ Assign New Driver</button>
            </div>

            <div class="table-header">
                <div class="table-h2">
                    <h2>Schedule Table</h2>
                </div>

                <div>
                    <button class="sche-btn">All</button>
                    <button class="sche-btn">Bus</button>
                    <button class="sche-btn">Jeep</button>
                    <button class="sche-btn">Bao-bao</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Driver's Name</th>
                            <th>Vehicle Type</th>
                            <th>Plate No.</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>

        </section>
    </main>
</body>
</html>
